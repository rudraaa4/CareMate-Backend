<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>CareMate API Tester</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.4; }
  h1 { font-size: 1.3rem; }
  .note { color: #888; font-size: 0.85rem; margin-bottom: 1.5rem; }
  fieldset { margin-bottom: 1.5rem; border-radius: 8px; }
  legend { font-weight: 600; padding: 0 0.4rem; }
  label { display: block; margin-top: 0.6rem; font-size: 0.9rem; }
  input { width: 100%; padding: 0.4rem; margin-top: 0.2rem; box-sizing: border-box; }
  button { margin-top: 0.8rem; padding: 0.5rem 1rem; cursor: pointer; }
  #token-box { font-size: 0.8rem; word-break: break-all; background: rgba(127,127,127,0.15); padding: 0.5rem; border-radius: 6px; margin-top: 0.5rem; }
  #log { background: rgba(127,127,127,0.1); border-radius: 8px; padding: 0.8rem; font-family: monospace; font-size: 0.85rem; white-space: pre-wrap; max-height: 320px; overflow-y: auto; }
  .status-ok { color: #2a7d2a; }
  .status-err { color: #c0392b; }
</style>
</head>
<body>

<h1>CareMate API Tester</h1>
<p class="note">
  Dev-only tool for manually exercising the backend while it's being built.
  This is <strong>not</strong> CareMate's real frontend (that's Phase 30 — React).
</p>

<label>API base URL
  <input id="base-url" value="http://127.0.0.1:8001" />
</label>

<fieldset>
  <legend>1. Register</legend>
  <label>Email <input id="reg-email" value="testuser@example.com" /></label>
  <label>Password <input id="reg-password" type="password" value="testpassword123" /></label>
  <button onclick="register()">Register</button>
</fieldset>

<fieldset>
  <legend>2. Login</legend>
  <label>Email <input id="login-email" value="testuser@example.com" /></label>
  <label>Password <input id="login-password" type="password" value="testpassword123" /></label>
  <button onclick="login()">Login</button>
  <div id="token-box">No token yet — login to get one.</div>
</fieldset>

<fieldset>
  <legend>3. Protected route</legend>
  <button onclick="getMe()">GET /api/v1/users/me (using stored token)</button>
  <button onclick="clearToken()">Clear token</button>
</fieldset>

<fieldset>
  <legend>4. Patient profile</legend>
  <button onclick="getProfile()">GET /api/v1/profile</button>
  <label>Full name <input id="profile-name" value="Asha Rao" /></label>
  <label>Date of birth <input id="profile-dob" type="date" value="1990-05-20" /></label>
  <label>Phone <input id="profile-phone" value="9876543210" /></label>
  <button onclick="patchProfile()">PATCH /api/v1/profile</button>
</fieldset>

<fieldset>
  <legend>5. Medicines</legend>
  <label>Name <input id="med-name" value="Metformin" /></label>
  <label>Strength <input id="med-strength" value="500mg" /></label>
  <button onclick="createMedicine()">POST /api/v1/medicines</button>
  <button onclick="listMedicines()">GET /api/v1/medicines</button>
  <label>Medicine ID (for get/archive below) <input id="med-id" value="1" /></label>
  <button onclick="getMedicine()">GET /api/v1/medicines/:id</button>
  <button onclick="archiveMedicine()">DELETE /api/v1/medicines/:id (archive)</button>
</fieldset>

<fieldset>
  <legend>Response log</legend>
  <div id="log">(nothing yet)</div>
</fieldset>

<script>
let accessToken = null;

function baseUrl() {
  return document.getElementById("base-url").value.replace(/\/$/, "");
}

function log(label, status, body) {
  const el = document.getElementById("log");
  const cls = status >= 200 && status < 300 ? "status-ok" : "status-err";
  const line = `[${new Date().toLocaleTimeString()}] ${label} -> <span class="${cls}">${status}</span>\n${JSON.stringify(body, null, 2)}\n\n`;
  el.innerHTML = line + el.innerHTML;
}

async function register() {
  const email = document.getElementById("reg-email").value;
  const password = document.getElementById("reg-password").value;
  try {
    const res = await fetch(`${baseUrl()}/api/v1/auth/register`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const body = await res.json();
    log("POST /auth/register", res.status, body);
  } catch (err) {
    log("POST /auth/register", "ERR", String(err));
  }
}

async function login() {
  const email = document.getElementById("login-email").value;
  const password = document.getElementById("login-password").value;
  try {
    const form = new URLSearchParams();
    form.set("username", email);
    form.set("password", password);
    const res = await fetch(`${baseUrl()}/api/v1/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: form,
    });
    const body = await res.json();
    log("POST /auth/login", res.status, body);
    if (res.ok) {
      accessToken = body.access_token;
      document.getElementById("token-box").textContent = accessToken;
    }
  } catch (err) {
    log("POST /auth/login", "ERR", String(err));
  }
}

async function getMe() {
  try {
    const headers = accessToken ? { Authorization: `Bearer ${accessToken}` } : {};
    const res = await fetch(`${baseUrl()}/api/v1/users/me`, { headers });
    const body = await res.json();
    log("GET /users/me", res.status, body);
  } catch (err) {
    log("GET /users/me", "ERR", String(err));
  }
}

function clearToken() {
  accessToken = null;
  document.getElementById("token-box").textContent = "No token yet — login to get one.";
}

async function getProfile() {
  try {
    const headers = accessToken ? { Authorization: `Bearer ${accessToken}` } : {};
    const res = await fetch(`${baseUrl()}/api/v1/profile`, { headers });
    const body = await res.json();
    log("GET /profile", res.status, body);
  } catch (err) {
    log("GET /profile", "ERR", String(err));
  }
}

async function patchProfile() {
  const full_name = document.getElementById("profile-name").value;
  const date_of_birth = document.getElementById("profile-dob").value;
  const phone = document.getElementById("profile-phone").value;
  try {
    const headers = { "Content-Type": "application/json" };
    if (accessToken) headers.Authorization = `Bearer ${accessToken}`;
    const res = await fetch(`${baseUrl()}/api/v1/profile`, {
      method: "PATCH",
      headers,
      body: JSON.stringify({ full_name, date_of_birth, phone }),
    });
    const body = await res.json();
    log("PATCH /profile", res.status, body);
  } catch (err) {
    log("PATCH /profile", "ERR", String(err));
  }
}

function authHeaders(extra = {}) {
  const headers = { ...extra };
  if (accessToken) headers.Authorization = `Bearer ${accessToken}`;
  return headers;
}

async function createMedicine() {
  const name = document.getElementById("med-name").value;
  const strength = document.getElementById("med-strength").value;
  try {
    const res = await fetch(`${baseUrl()}/api/v1/medicines`, {
      method: "POST",
      headers: authHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify({ name, strength }),
    });
    const body = await res.json();
    log("POST /medicines", res.status, body);
    if (res.ok) document.getElementById("med-id").value = body.id;
  } catch (err) {
    log("POST /medicines", "ERR", String(err));
  }
}

async function listMedicines() {
  try {
    const res = await fetch(`${baseUrl()}/api/v1/medicines`, { headers: authHeaders() });
    const body = await res.json();
    log("GET /medicines", res.status, body);
  } catch (err) {
    log("GET /medicines", "ERR", String(err));
  }
}

async function getMedicine() {
  const id = document.getElementById("med-id").value;
  try {
    const res = await fetch(`${baseUrl()}/api/v1/medicines/${id}`, { headers: authHeaders() });
    const body = await res.json();
    log(`GET /medicines/${id}`, res.status, body);
  } catch (err) {
    log(`GET /medicines/${id}`, "ERR", String(err));
  }
}

async function archiveMedicine() {
  const id = document.getElementById("med-id").value;
  try {
    const res = await fetch(`${baseUrl()}/api/v1/medicines/${id}`, {
      method: "DELETE",
      headers: authHeaders(),
    });
    const body = await res.json();
    log(`DELETE /medicines/${id}`, res.status, body);
  } catch (err) {
    log(`DELETE /medicines/${id}`, "ERR", String(err));
  }
}
</script>

</body>
</html>
